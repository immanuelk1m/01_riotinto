[project]
name = "01-riotinto"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kedro>=1.8.0",
    "kedro-datasets[pandas-parquetdataset,pickle-pickledataset]>=10.0.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "wandb>=0.31.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "dcor>=0.6",
    "ipykernel>=7.4.0",
    "lingam>=1.12.2",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "tigramite>=5.2.10.1",
]

[tool.kedro]
package_name = "src"
project_name = "riotinto"
kedro_init_version = "1.8.0"
source_dir = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
