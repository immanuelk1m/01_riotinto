[project]
name = "01-riotinto"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kedro>=1.8.0",
    "kedro-datasets[pandas-parquetdataset,pickle-pickledataset]>=10.0.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "wandb>=0.31.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "causal-learn>=0.1.4.8",
    "causalchange>=0.1.1",
    "causalts>=0.28.1",
    "dcor>=0.6",
    "hyppo>=0.5.2",
    "ipykernel>=7.4.0",
    "lingam>=1.12.2",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "networkx>=3.0",
    "openpyxl>=3.1.5",
    "ortools>=9.15",
    "pytest>=9.2.0",
    "ruptures>=1.1.10",
    "tigramite>=5.2.10.1",
]

[tool.uv]
# causalchange 0.1.1 은 numpy<2 로 고정돼 있지만 numpy 1 전용 API 를 쓰지 않는다(2026-11-15 확인). 환경은 하나만 쓴다.
override-dependencies = ["numpy>=2.5.4"]

[tool.kedro]
package_name = "src"
project_name = "riotinto"
kedro_init_version = "1.8.0"
source_dir = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
