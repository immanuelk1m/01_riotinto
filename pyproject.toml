[project]
name = "01-riotinto"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kedro>=1.8.0",
    "kedro-datasets[pandas-parquetdataset,pickle-pickledataset]>=10.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.kedro]
package_name = "src"
project_name = "riotinto"
kedro_init_version = "1.8.0"
source_dir = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
